name: Deploy Landing

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy only uses SSH secrets, so the GitHub token can stay read-only.
permissions:
  contents: read

# One deploy at a time. A newer push waits instead of racing the running one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy landing to server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # Host key check. Add the secret (SHA256 fingerprint of the server's
          # host key) to turn it on; while it's unset the check is skipped.
          fingerprint: ${{ secrets.SERVER_SSH_FINGERPRINT }}
          command_timeout: 30m
          script: |
            set -e
            compose() {
              if docker compose version >/dev/null 2>&1; then
                docker compose "$@"
              else
                docker-compose "$@"
              fi
            }

            cd ~/personal/GoPort/landing
            git pull --ff-only origin main
            cd ..
            compose build landing
            compose rm -sf landing || true
            docker rm -f goport-landing || true
            compose up -d --no-deps landing
